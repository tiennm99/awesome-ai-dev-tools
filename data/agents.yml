# Curated list of AI agent coding tools.
# Edit this file to add, remove, or retag entries.
# The daily GitHub Actions run will refresh stars and regenerate README.md.
#
# owner/repo must be the CURRENT canonical GitHub slug. When a tracked repo is
# renamed, update it here AND add a key migration in history.go so historical
# star data stays attached.
#
# tags describe each tool across five facets — surface (at least one required),
# model access, workflow, integration, and origin (at most one). The full
# vocabulary and the evidence rule for applying a tag live in
# docs/CONTRIBUTING.md; `go run . -check` rejects anything outside it.

